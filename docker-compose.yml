version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: auth_app_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: my_auth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: auth_app_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - DB_TYPE=postgres
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/my_auth_db
      - SECRET_KEY=production-secret-key-change-me
      - OPENWEATHER_API_KEY=your_openweather_api_key_here
      - GNEWS_API_KEY=your_gnews_api_key_here
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
