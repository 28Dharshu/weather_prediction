<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Modern App</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-layer-group"></i> ModernApp</h2>
            </div>

            <nav class="sidebar-menu">
                <div class="menu-item">
                    <a href="/dashboard">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </div>
                <div class="menu-item">
                    <a href="/profile" class="active">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </div>
                <div class="menu-item">
                    <a href="/gallery">
                        <i class="fas fa-images"></i>
                        <span>Gallery</span>
                    </a>
                </div>
                <div class="menu-item">
                    <a href="/logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Profile Header Card -->
            <section class="profile-header-card">
                <div id="profileAvatar" class="profile-avatar-large">
                    <i class="fas fa-user"></i>
                </div>

                <div class="profile-details">
                    <h1 id="profileUsername">Loading...</h1>
                    <p id="profileEmail"><i class="fas fa-envelope"></i> Loading...</p>
                    <p id="profileLocation"><i class="fas fa-map-marker-alt"></i> Loading...</p>

                    <div class="profile-stats">
                        <div class="stat-item">
                            <div class="stat-number" id="statPostsCount">0</div>
                            <div class="stat-title">Posts</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="statFollowersCount">0</div>
                            <div class="stat-title">Followers</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="statFollowingCount">0</div>
                            <div class="stat-title">Following</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Personal Gallery Section -->
            <section>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 style="font-size:22px; font-weight:700;">Your Uploads</h2>
                    <a href="/dashboard" class="btn btn-outline btn-sm">
                        <i class="fas fa-cloud-upload-alt"></i> Upload New
                    </a>
                </div>

                <div id="profileGalleryGrid" class="gallery-grid">
                    <div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--gray);">
                        <i class="fas fa-spinner fa-spin" style="font-size:28px;"></i>
                        <p style="margin-top:10px;">Loading your gallery...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/profile.js"></script>
</body>
</html>
