<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Gallery - Modern App</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-layer-group"></i> ModernApp</h2>
            </div>

            <nav class="sidebar-menu">
                <div class="menu-item">
                    <a href="/dashboard">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </div>
                <div class="menu-item">
                    <a href="/profile">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </div>
                <div class="menu-item">
                    <a href="/gallery" class="active">
                        <i class="fas fa-images"></i>
                        <span>Gallery</span>
                    </a>
                </div>
                <div class="menu-item">
                    <a href="/logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Community Gallery</h1>
                    <p style="color:var(--gray); font-size:14px; margin-top:4px;">
                        Explore photos and moments shared by members of the community
                    </p>
                </div>
                <a href="/dashboard" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus"></i> Share Photo
                </a>
            </header>

            <!-- Community Gallery Grid -->
            <section id="communityGalleryGrid" class="gallery-grid">
                <div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--gray);">
                    <i class="fas fa-spinner fa-spin" style="font-size:28px;"></i>
                    <p style="margin-top:10px;">Loading community posts...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/gallery.js"></script>
</body>
</html>
